[project]
name = "minie"
version = "0.1.0"
description = "Discord soundboard bot"
readme = "README.md"
authors = [
    { name = "Pierre Brunisholz", email = "pierre@brunisholz.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "discord-py[voice]>=2.7.1",
]

[project.scripts]
minie = "minie.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ASYNC catches blocking calls inside coroutines: in a bot, one of those stalls the
# gateway heartbeat and every voice connection at once.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
