<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>minie</title>
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header>
    <h1>minie</h1>
    <select id="guild" aria-label="Server" hidden></select>
    <span id="user"></span>
    <button id="sign-out" type="button" hidden>Sign out</button>
  </header>
  <main>
    <p id="message" class="muted">Loading…</p>
    <section id="board" hidden>
      <div id="status-bar">
        <span id="status"></span>
        <span id="armed" hidden></span>
        <button id="media-keys" type="button" aria-pressed="false"
          title="Play/pause fires the armed sound, next/previous move through your favourites, even while another app has focus">Media keys: off</button>
        <button id="stop" type="button">⏹ Stop</button>
        <button id="leave" type="button">Leave</button>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="grid" class="grid"></div>
      <details id="add-sound">
        <summary>Add a sound</summary>
        <form id="add-form">
          <label>Name <input id="add-name" name="name" required maxlength="32" autocomplete="off"></label>
          <label>File <input id="add-file" name="file" type="file" accept="audio/*,.ogg,.webm,.m4a,.flac" required></label>
          <button type="submit">Add</button>
          <p id="name-rules" class="muted"></p>
        </form>
      </details>
    </section>
  </main>
  <dialog id="manage">
    <form id="manage-form" method="dialog">
      <h2 id="manage-title"></h2>
      <label>New name <input id="manage-name" maxlength="32" autocomplete="off"></label>
      <div class="actions">
        <button id="manage-rename" type="button">Rename</button>
        <button id="manage-remove" type="button" class="danger">Remove</button>
        <button value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>
</body>
</html>
